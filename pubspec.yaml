name: xconnect
description: A cross-platform VPN client for secure network connections and configuration management.
version: 1.1.1+8

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.5
  http: ^1.6.0
  path_provider: ^2.1.5
  archive: ^3.3.1
  path: ^1.8.3
  process_run: 1.1.0
  ffi: ^2.2.0
  sqlite3: 2.4.7
  # Ships libsqlite3.so inside the APK. Without it the Android build has no
  # library to dlopen and every node read/write fails at runtime (Pixel 7a,
  # 2026-09-20). 0.6.0+eol is a no-op tombstone for package:sqlite3 3.x, so
  # the 0.5.x line is the one that still bundles the native library.
  sqlite3_flutter_libs: ^0.5.24
  cryptography: ^2.5.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  flutter_lints: 4.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.4
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.3  # ✅ 升级：解决唯一一个受限 direct dependency
  mobile_scanner: ^7.2.0
  file_picker: ^10.3.10
  zxing2: ^0.2.4
  image: ^4.3.0
  # 7.1+ uses macOS 26 SDK APIs; keep compatible with the current macOS CI SDK.
  connectivity_plus: 7.0.0
  network_info_plus: ^7.0.0

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.1.7
  json_serializable: 6.11.2
  msix: ^3.16.13
  pigeon: ^22.7.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/logo.png
  image_path: assets/logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/browser_privacy_check.html
